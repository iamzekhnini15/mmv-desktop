name: CI

# CI minimale de l'Étape 0 (Phase 2A) : restore / build / test / scan de vulnérabilités.
# Aucun déploiement, aucun artefact commercial, aucun secret de production.

on:
  push:
    branches:
      - main
      - 'phase*'
      - 'p2*'
      - 'p3*'
      - 'p4*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan:
    name: Restore / Build / Test / Scan
    # MMV.App est une application desktop Windows (OutputType=WinExe + app.manifest) :
    # le runner Windows est le plus représentatif de la cible.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (SDK verrouillé par global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Diagnostic SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore MMV.sln

      # Build sans -warnaserror : les avertissements restent VISIBLES dans le journal
      # mais ne font pas échouer le pipeline (un CS1998 préexistant est hors périmètre Étape 0).
      - name: Build
        run: dotnet build MMV.sln --no-restore -c Debug

      - name: Test
        run: dotnet test MMV.sln --no-build -c Debug --logger "trx;LogFileName=test-results.trx"

      # Audit des dépendances vulnérables (P2A-0B). Défense en profondeur :
      #   1) La restauration a déjà appliqué l'audit NuGet (Directory.Build.props, NuGetAuditMode=all).
      #      En CI, NU1903/NU1904 (High/Critical) et NU1900/NU1905 (échec de récupération de la base
      #      d'avis) sont BLOQUANTS — un échec de récupération n'est jamais traité comme « 0 vuln ».
      #   2) Ce step ajoute un rapport lisible (logs) + un contrôle MACHINE sur le JSON officiel :
      #      échec si une vulnérabilité High/Critical est présente, ou si le scan est NON CONCLUANT
      #      (commande en échec, sortie vide, ou JSON invalide). On ne se fie plus à un grep de texte.
      - name: Audit des packages vulnérables (JSON + sévérité)
        shell: pwsh
        run: |
          # (1) Rapport humainement lisible dans les logs.
          dotnet list MMV.sln package --vulnerable --include-transitive
          $textCode = $LASTEXITCODE

          # (2) Rapport lisible par machine (format JSON officiel et versionné).
          $raw = dotnet list MMV.sln package --vulnerable --include-transitive --format json --output-version 1 | Out-String
          $jsonCode = $LASTEXITCODE

          if ($textCode -ne 0 -or $jsonCode -ne 0) {
            Write-Error "Echec de 'dotnet list package --vulnerable' (text=$textCode json=$jsonCode) : scan NON concluant."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($raw)) {
            Write-Error "Sortie JSON vide : scan de vulnerabilites NON concluant."
            exit 1
          }
          try {
            $report = $raw | ConvertFrom-Json
          } catch {
            Write-Error "JSON d'audit invalide : $($_.Exception.Message)"
            exit 1
          }

          $hits = New-Object System.Collections.Generic.List[string]
          foreach ($project in $report.projects) {
            foreach ($fw in $project.frameworks) {
              $packages = @()
              if ($fw.topLevelPackages)   { $packages += $fw.topLevelPackages }
              if ($fw.transitivePackages) { $packages += $fw.transitivePackages }
              foreach ($pkg in $packages) {
                foreach ($vuln in $pkg.vulnerabilities) {
                  if ($vuln.severity -imatch '^(High|Critical)$') {
                    $hits.Add(("{0} :: {1} {2} [{3}] {4}" -f $project.path, $pkg.id, $pkg.resolvedVersion, $vuln.severity, $vuln.advisoryurl))
                  }
                }
              }
            }
          }

          if ($hits.Count -gt 0) {
            Write-Host "Vulnerabilites High/Critical detectees :"
            $hits | ForEach-Object { Write-Host "  - $_" }
            Write-Error ("Echec : {0} vulnerabilite(s) High/Critical." -f $hits.Count)
            exit 1
          }
          Write-Host "Aucune vulnerabilite High/Critical detectee."

      # Outil EF Core verrouille par le manifeste local (.config/dotnet-tools.json) :
      # restauration explicite avant tout appel `dotnet ef` sur le runner.
      - name: Restore .NET tools
        run: dotnet tool restore

      # Contrôle EF Core (depuis P2A-1R19) : le modèle compilé doit être STRICTEMENT
      # aligné sur la dernière migration. `has-pending-model-changes` sort en échec
      # (exit code non nul) si un changement de modèle n'a pas encore été matérialisé
      # par une migration. `--no-build` réutilise le binaire Debug déjà produit ci-dessus.
      - name: Check EF Core pending model changes
        run: dotnet ef migrations has-pending-model-changes --project src/MMV.Infrastructure --no-build

      # Même contrôle sur la chaîne de migrations PostgreSQL (P4-5E-C, C7). Aucun serveur contacté :
      # la factory design-time utilise une chaîne factice constante et `migrations list` tourne en
      # `--no-connect`. La variable design-time est posée sur CE SEUL step, jamais au niveau du job
      # (D-05.6) : le step SQLite ci-dessus s'exécute sans elle, donc à l'identique.
      #   1) Garde contre le faux vert (Q2) : sans la variable (clé absente ou mal orthographiée), la
      #      factory retombe sur SQLite et `has-pending-model-changes` contrôlerait la chaîne SQLite en
      #      répondant vert. On exige donc d'abord, sous le même `env:`, que la chaîne listée contienne
      #      la baseline PostgreSQL et PAS `InitialCreate` (SQLite). Contrôle MACHINE sur le JSON officiel.
      #   2) Dérive du modèle : attrape des écarts que le step SQLite ne voit pas (ex. HasMaxLength,
      #      TEXT des deux côtés sur SQLite, varchar(n) sur PostgreSQL).
      - name: Check EF Core pending model changes (PostgreSQL chain)
        shell: pwsh
        env:
          MMV_DESIGNTIME_DATABASE_PROVIDER: postgresql
        run: |
          $project = 'src/MMV.Infrastructure.PostgreSQL.Migrations'

          # (1) Chaîne réellement contrôlée. Avec --prefix-output, seules les lignes 'data:' portent le JSON ;
          #     les autres (info:, warn:, error:) sont renvoyées au journal pour que la cause d'un échec reste visible.
          $lines = @(dotnet ef migrations list --no-connect --json --prefix-output --project $project --startup-project $project --no-build)
          $lines | Where-Object { $_ -notlike 'data:*' } | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Echec de 'dotnet ef migrations list' (code $LASTEXITCODE) : chaine PostgreSQL NON verifiee."
            exit 1
          }
          $json = ($lines | Where-Object { $_ -like 'data:*' } | ForEach-Object { $_.Substring(5) }) -join "`n"
          if ([string]::IsNullOrWhiteSpace($json)) {
            Write-Error "Sortie JSON vide : chaine PostgreSQL NON verifiee."
            exit 1
          }
          try {
            $migrations = $json | ConvertFrom-Json
          } catch {
            Write-Error "JSON de 'migrations list' invalide : $($_.Exception.Message)"
            exit 1
          }
          $names = @(foreach ($m in $migrations) { $m.name })
          Write-Host ("Chaine controlee : {0} migration(s)." -f $names.Count)
          foreach ($m in $migrations) { Write-Host "  - $($m.id)" }
          if ($names -notcontains 'InitialPostgreSqlBaseline') {
            Write-Error "Baseline 'InitialPostgreSqlBaseline' absente : la chaine controlee n'est PAS la chaine PostgreSQL."
            exit 1
          }
          if ($names -contains 'InitialCreate') {
            Write-Error "Migration SQLite 'InitialCreate' presente : la chaine controlee n'est PAS la chaine PostgreSQL."
            exit 1
          }

          # (2) Dérive du modèle sur la chaîne PostgreSQL.
          dotnet ef migrations has-pending-model-changes --project $project --startup-project $project --no-build
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Controle de derive PostgreSQL en echec (code $LASTEXITCODE) : changement de modele sans migration PostgreSQL, ou commande en echec."
            exit 1
          }
